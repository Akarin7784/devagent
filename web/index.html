<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="DevAgent —— 多 Agent 协作的智能软件研发助手控制台。以上下文工程驱动的编排、验证与可观测性。" />
  <title>DevAgent · 多 Agent 协作研发助手</title>

  <!--
    主题预设：在样式表加载前同步执行，避免暗色用户的白色闪屏（FOUC）。
    这是内联脚本存在的唯一理由 —— 挪到外部文件会晚于首次绘制，失去意义。
  -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('devagent.theme') || 'system';
        var dark = pref === 'dark'
          || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* 隐私模式下 localStorage 不可用，用默认亮色 */ }
    })();
  </script>

  <!-- 设计令牌必须最先加载：后续样式全部依赖其中的 CSS 变量 -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234a6cf7'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EDA%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- 应用外壳由 js/shell.js 挂载到这里 -->
  <div id="app" class="app-shell"></div>

  <!--
    启动期兜底：脚本加载失败（离线、路径错误）时给出可读提示而非白屏。
    一旦 shell 完成挂载，这个节点会被清空。
  -->
  <noscript>
    <div style="max-width: 560px; margin: 80px auto; padding: 24px; font-family: system-ui, sans-serif; line-height: 1.7; color: #232b39;">
      <h1 style="font-size: 20px; margin: 0 0 8px;">需要启用 JavaScript</h1>
      <p style="color: #6b7689; margin: 0;">
        DevAgent 控制台是单页应用，依赖 JavaScript 完成路由与实时事件流订阅。
        请在浏览器设置中为本站点启用 JavaScript 后刷新页面。
      </p>
    </div>
  </noscript>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
