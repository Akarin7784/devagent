name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请描述**要解决的问题**，而不只是想要的实现。
        「我需要 X 功能」不如「我在做 Y 时遇到了 Z 障碍」有价值。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么障碍？
      placeholder: |
        当任务包含超过 10 个 DAG 节点时，我无法从 API 得知整体进度……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你倾向于怎么解决？（可选）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 以及为什么放弃它们
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及方向
      multiple: true
      options:
        - 上下文工程能力
        - 编排与可靠性
        - 新增 Agent 角色
        - 新增模型供应商
        - API / 前端
        - 评测体系
        - 可观测性
        - 文档
        - 性能
        - 其他

  - type: checkboxes
    id: willing
    attributes:
      label: 你愿意提交 PR 吗？
      options:
        - label: 我愿意实现这个功能
          required: false
        - label: 我可以帮忙测试
          required: false
