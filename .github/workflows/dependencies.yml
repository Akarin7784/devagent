# Dependency review + 依赖自动更新
name: Dependencies

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
  schedule:
    - cron: "23 4 * * 2"   # 每周二 04:23 UTC

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit installed dependencies
        run: |
          pip install -e .
          pip-audit --format columns || true
        # 首次运行仅报告不阻塞；稳定后可改为强制

  # PR 中检查新增依赖的许可证与已知漏洞
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
