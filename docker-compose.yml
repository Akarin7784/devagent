# DevAgent 本地开发依赖服务
#
# 说明：项目默认以**内存模式**运行，不需要任何外部服务即可跑通冒烟与全量测试。
# 本文件用于需要持久化 / 向量检索 / 分布式缓存时的完整部署。
#
# 启动：docker compose up -d
# 停止：docker compose down
# 清空数据：docker compose down -v

services:
  # ------------------------------------------------------------------ #
  # PostgreSQL + pgvector（任务持久化 + 代码向量检索）
  # ------------------------------------------------------------------ #
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devagent
      POSTGRES_PASSWORD: devagent
      POSTGRES_DB: devagent
      # 中文环境下建议显式指定，避免排序行为不一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devagent -d devagent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------ #
  # Redis（语义缓存共享 + 任务队列）
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    container_name: devagent-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ #
  # 应用本体（可选：本地开发时更推荐直接 uvicorn --reload）
  # ------------------------------------------------------------------ #
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devagent-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 只能是 development / testing / production（Settings.env 是 Literal）。
      # 曾写成 docker，容器会因 ValidationError 直接崩溃重启。
      DEVAGENT_ENV: production
      # 键名必须是 DEVAGENT_DATABASE__URL：配置里没有 db 这一层，
      # 写错会被 extra="ignore" 静默丢弃，容器转而连自己的 localhost 并失败。
      DEVAGENT_DATABASE__URL: postgresql+asyncpg://devagent:devagent@postgres:5432/devagent
      # 本文件存在的意义就是持久化，因此显式选 sql 后端（默认是 memory）。
      DEVAGENT_STORAGE__BACKEND: sql
      DEVAGENT_REDIS__URL: redis://redis:6379/0
      # 模型 Key 从宿主机环境透传（不要写进本文件）。
      # 必须带 DEVAGENT_MODELS__<PROVIDER>__ 前缀，裸的 DEEPSEEK_API_KEY 不会被读取。
      DEVAGENT_MODELS__DEEPSEEK__API_KEY: ${DEEPSEEK_API_KEY:-}
      DEVAGENT_MODELS__DEEPSEEK__BASE_URL: https://api.deepseek.com/v1
      DEVAGENT_MODELS__QWEN__API_KEY: ${QWEN_API_KEY:-}
      DEVAGENT_MODELS__QWEN__BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DEVAGENT_MODELS__ZHIPU__API_KEY: ${ZHIPU_API_KEY:-}
      DEVAGENT_MODELS__ZHIPU__BASE_URL: https://open.bigmodel.cn/api/paas/v4
      DEVAGENT_OBSERVABILITY__METRICS_ENABLED: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["full"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
